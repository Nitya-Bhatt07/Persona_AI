<!DOCTYPE html>

<html>
<head>
<title>PersonaAI 💫</title>
<style>
body{
font-family:sans-serif;
background:linear-gradient(135deg,#ff9a9e,#a18cd1);
color:white;text-align:center;
}

.card{
margin:30px auto;
width:90%;
padding:20px;
border-radius:20px;
background:rgba(255,255,255,0.1);
backdrop-filter:blur(20px);
animation:fade 1s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;}
}

button{
padding:8px 12px;
margin:5px;
border:none;
border-radius:20px;
cursor:pointer;
transition:0.3s;
}

.option{background:#ffffff30;}
.option:hover
.selected{background:#6c5ce7;}

#spinner{display:none;font-size:20px;}

.result-card{
margin-top:20px;
animation:fade 1s ease;
} </style>

</head>

<body>

<div class="card">
<h1>✨ PersonaAI Premium</h1>
<p>Choose how much you relate (1 = low, 5 = high)</p>

<div id="questions"></div>

<button onclick="predict()">Reveal Personality 💫</button>

<div id="spinner">💖 Analyzing...</div>

<div id="result"></div>

<input id="fb" placeholder="Your feedback ❤️"/>
<button onclick="sendFeedback()">Submit</button>
</div>

<script>
let answers={};

const questions=[
"Leadership skills","Creativity","Decision making",
"Imagination","Artistic thinking","Innovation",
"Logical thinking","Problem solving","Analysis",
"Socializing","Communication","Networking",
"Calmness","Patience","Emotional balance"
];

let html="";
questions.forEach((q,i)=>{
html+=`<p>${q}</p>`;
for(let j=1;j<=5;j++){
html+=`<button class="option" onclick="select(${i+1},${j},this)">${j}</button>`;
}
});
document.getElementById("questions").innerHTML=html;

function select(q,v,el){
answers[q]=v;
el.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("selected"));
el.classList.add("selected");
}

async function predict(){
if(Object.keys(answers).length<15){
alert("Please answer all questions 😤");return;
}

spinner.style.display="block";

let params="";
for(let i=1;i<=15;i++){params+=`q${i}=${answers[i]}&`;}

let res=await fetch(`https://YOUR_RENDER_URL/predict?${params}`);
let data=await res.json();

spinner.style.display="none";

result.innerHTML=`
<div class="result-card card">
<h2>${data.title}</h2>
<p>${data.desc}</p>
<p>✨ ${data.advice}</p>
</div>`;
}

async function sendFeedback(){
let msg=document.getElementById("fb").value;
await fetch(`https://YOUR_RENDER_URL/feedback?msg=${msg}`);
alert("Thank you 💖");
}
</script>

</body>
</html>
